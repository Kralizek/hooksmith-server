name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Check
        run: deno task check

      - name: Validate packages
        run: deno publish --dry-run

      - name: Resolve package version
        id: version
        shell: bash
        run: echo "version=$(jq -r .version packages/server/deno.json)" >> "$GITHUB_OUTPUT"

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            HOOKSMITH_VERSION=${{ steps.version.outputs.version }}
