name: Docker

on:
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
      - .github/workflows/release.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Resolve latest release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          if ! tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>"$error_file")"; then
            if grep -q "HTTP 404" "$error_file"; then
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "No published release exists yet; skipping container build."
              exit 0
            fi
            cat "$error_file" >&2
            exit 1
          fi
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Latest release tag $tag is not a stable semantic version." >&2
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build container image
        if: steps.release.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            HOOKSMITH_VERSION=${{ steps.release.outputs.version }}
